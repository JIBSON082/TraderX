<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>iFVG Scanner</title>
<style>
:root{--bg:#f6f6f4;--card:#fff;--tx:#1a1a1a;--mu:#6b6b6b;--bd:#e2e2de;--ok:#14803c;--no:#c62828;--wa:#b26a00;--ac:#d71f1f}
@media(prefers-color-scheme:dark){:root{--bg:#121212;--card:#1c1c1c;--tx:#eee;--mu:#9a9a9a;--bd:#2e2e2e;--ok:#4cc27a;--no:#ff6b6b;--wa:#f0a63a;--ac:#ff4a4a}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.45 system-ui,sans-serif;padding:16px;max-width:1100px;margin:auto}
h1{font-size:20px;margin:4px 0}
.mu{color:var(--mu);font-size:13px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:12px;margin:14px 0}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;overflow:hidden}
.card>button{all:unset;display:flex;justify-content:space-between;align-items:center;width:100%;box-sizing:border-box;padding:14px;cursor:pointer;font-weight:600}
.card>button:hover{background:var(--bg)}
.card>button small{color:var(--ac);font-weight:600}
.res{padding:0 14px 14px}
.v{border-radius:8px;padding:10px;margin-bottom:10px;border:1px solid var(--bd)}
.v.v{border-color:var(--ok);color:var(--ok)}.v.x{color:var(--no)}.v.l{border-color:var(--wa);color:var(--wa)}
.big{font-size:18px;font-weight:700}
table{width:100%;border-collapse:collapse;margin-bottom:8px}
td{padding:5px 0;border-bottom:1px solid var(--bd)}td:last-child{text-align:right;font-weight:600;font-variant-numeric:tabular-nums}
ul{list-style:none;padding:0;margin:8px 0}
li{padding:5px 0;font-size:13px;display:flex;flex-direction:column}
li.ok b{color:var(--ok)}li.no b{color:var(--no)}li span{color:var(--mu)}
p{margin:6px 0}
</style>
</head>
<body>
<h1>iFVG Scanner</h1>
<div class="mu">Tap a pair to pull live 1m + 5m data and run the setup rules.</div>
<div class="grid" id="grid"></div>
<p class="mu">Educational tool based on the Sanos iFVG checklist, not financial advice. Data comes from Yahoo Finance and can lag by a minute or more, so always confirm the entry on your own live chart before trading.</p>

<script>
// ---- Settings: edit pairs here. d = decimals, p = minimum FVG size as % of price (9 NQ points ≈ 0.035%) ----
const PAIRS=[
{n:'Gold',s:'XAUUSD',y:['XAUUSD=X','GC=F'],d:2,p:0.035},
{n:'Bitcoin',s:'BTCUSD',y:['BTC-USD'],d:1,p:0.035},
{n:'Euro',s:'EURUSD',y:['EURUSD=X'],d:5,p:0.035},
{n:'Pound',s:'GBPUSD',y:['GBPUSD=X'],d:5,p:0.035},
{n:'Dollar / Yen',s:'USDJPY',y:['JPY=X'],d:3,p:0.035},
{n:'Pound / Yen',s:'GBPJPY',y:['GBPJPY=X'],d:3,p:0.035}];
const MIN_RR=1.5;
const NAMES={sweep:'Liquidity sweep (5m)',ifvg:'iFVG (1m)',size:'FVG size',delivery:'Delivery',targets:'Targets'};
const $=id=>document.getElementById(id);
const mir=a=>a.map(x=>({t:x.t,o:-x.o,h:-x.l,l:-x.h,c:-x.c}));
const T=t=>new Date(t).toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'});

async function getJSON(url){
  for(const u of [url,'https://corsproxy.io/?'+encodeURIComponent(url),'https://api.allorigins.win/raw?url='+encodeURIComponent(url)]){
    try{const r=await fetch(u,{cache:'no-store'});if(r.ok)return await r.json()}catch(e){}
  }
  throw new Error('Data feed unreachable');
}
async function candles(sym,iv,range){
  const j=await getJSON(`https://query1.finance.yahoo.com/v8/finance/chart/${encodeURIComponent(sym)}?interval=${iv}&range=${range}&_=${Date.now()}`);
  const r=j.chart.result[0],q=r.indicators.quote[0],o=[];
  r.timestamp.forEach((t,i)=>{if([q.open[i],q.high[i],q.low[i],q.close[i]].every(v=>v!=null))o.push({t:t*1000,o:q.open[i],h:q.high[i],l:q.low[i],c:q.close[i]})});
  return o;
}
// pivot highs (hi=true) or lows, 2 bars each side
function piv(a,hi,n=2){
  const r=[];
  for(let i=n;i<a.length-n;i++){
    let ok=1;
    for(let d=1;d<=n&&ok;d++)for(const m of[i-d,i+d])if(hi?a[i].h<=a[m].h:a[i].l>=a[m].l)ok=0;
    if(ok)r.push(i);
  }
  return r;
}
// Short-side logic. BUY is the same logic run on mirrored (negated) candles; s=-1 flips levels back.
function scan(c1,c5,P,s){
  const dec=P.d,f=v=>(s*v).toFixed(dec),rg=(a,b)=>[s*a,s*b].sort((x,y)=>x-y).map(v=>v.toFixed(dec)).join('–');
  const hiN=s===1?'high':'low',gapN=s===1?'bullish':'bearish',delN=s===1?'bearish':'bullish';
  const ck={sweep:[0,`No 5m swing ${hiN} swept recently`],ifvg:[0,'Waiting for a sweep'],size:[0,'—'],delivery:[0,'—'],targets:[0,'—']};
  const n5=c5.length,n1=c1.length,ph=piv(c5,true);
  // 1) liquidity sweep: a 5m candle wicks past a clean swing level and closes back inside
  let sw=null;
  for(let k=n5-1;k>=Math.max(n5-30,0)&&!sw;k--)for(let q=ph.length-1;q>=0;q--){
    const p=ph[q];if(p>k-3)continue;if(k-p>150)break;
    const L=c5[p].h;
    if(c5[k].h>L&&c5[k].c<L&&c5.slice(p+1,k).every(x=>x.h<L)){sw={k,L};break}
  }
  if(!sw)return{ck};
  ck.sweep=[1,`5m swing ${hiN} ${f(sw.L)} swept at ${T(c5[sw.k].t)}`];
  const t0=c5[sw.k].t,X=Math.max(...c1.filter(x=>x.t>=t0).map(x=>x.h));
  // 2) 1m FVG that gets closed through after the sweep (inverse FVG)
  const cs=[];
  for(let i=Math.max(2,n1-200);i<n1;i++){
    const bot=c1[i-2].h,top=c1[i].l;if(top<=bot)continue;
    for(let j=i+1;j<n1;j++)if(c1[j].c<bot){if(c1[j].t>=t0&&j>=n1-30)cs.push({i,j,bot,top});break}
  }
  if(!cs.length){ck.ifvg=[0,`Sweep done, but no 1m ${gapN} FVG closed through yet`];return{ck}}
  cs.sort((a,b)=>b.j-a.j);
  function ev(cd){
    const k2={...ck},size=cd.top-cd.bot,min=Math.abs(c1[n1-1].c)*P.p/100;
    k2.ifvg=[1,`1m ${gapN} FVG ${rg(cd.bot,cd.top)} closed through at ${T(c1[cd.j].t)}`];
    k2.size=[size>=min?1:0,`Gap ${size.toFixed(dec)} vs minimum ${min.toFixed(dec)}`];
    // 3) delivery: sweep extreme tapped an opposing FVG on 1m or 5m
    let dl=null;
    for(const[a,tf,lim]of[[c1,'1m',300],[c5,'5m',200]]){
      for(let m=Math.max(2,a.length-lim);m<a.length&&!dl;m++){
        const top=a[m-2].l,bot=a[m].h;
        if(top>bot&&a[m].t<=c1[cd.j].t&&X>=bot&&X<=top)dl={tf,bot,top};
      }
      if(dl)break;
    }
    k2.delivery=dl?[1,`Delivering from ${dl.tf} ${delN} FVG ${rg(dl.bot,dl.top)}`]:[0,`Sweep not inside any 1m/5m ${delN} FVG`];
    // 4) targets: 5m swing levels in trade direction
    const entry=c1[cd.j].c,sl=Math.max(cd.top,c1[cd.j].h)+size*0.1,risk=sl-entry;
    const lows=piv(c5,false).filter(p=>p>n5-250).map(p=>c5[p].l).filter(l=>l<entry).sort((a,b)=>b-a);
    const tp=lows.find(l=>(entry-l)/risk>=MIN_RR);
    const be=lows.find(l=>l!==tp&&(entry-l)/risk>=0.5&&(tp===undefined||l>tp));
    const eq=lows.some((l,q)=>lows.some((m,r)=>r!==q&&Math.abs(l-m)<=Math.abs(l)*0.0003));
    const rr=tp!==undefined?(entry-tp)/risk:0;
    k2.targets=tp!==undefined?[1,`TP at 5m swing ${hiN==='high'?'low':'high'} ${f(tp)} (${rr.toFixed(1)}R)${eq?', equal levels nearby':''}${be!==undefined?`; break-even spot ${f(be)}`:''}`]:[0,`No clear 5m swing level gives at least ${MIN_RR}R`];
    if(!Object.values(k2).every(v=>v[0]))return{ck:k2};
    let state='live';
    for(let m=cd.j+1;m<n1;m++){if(c1[m].h>=sl){state='stopped';break}if(c1[m].l<=tp){state='tp';break}}
    const r5=c5.slice(-288),mid=(Math.max(...r5.map(x=>x.h))+Math.min(...r5.map(x=>x.l)))/2;
    return{ck:k2,setup:{entry:s*entry,sl:s*sl,tp:s*tp,be:be===undefined?null:s*be,rr,t:c1[cd.j].t,state,prem:entry>mid}};
  }
  let first=null;
  for(const cd of cs){const r=ev(cd);first=first||r;if(r.setup)return r}
  return first;
}

async function run(i){
  const P=PAIRS[i],el=$('r'+i);
  el.innerHTML='<p class="mu">Fetching live data…</p>';
  try{
    let c1,c5,used;
    for(const y of P.y){
      try{[c1,c5]=await Promise.all([candles(y,'1m','2d'),candles(y,'5m','5d')]);if(c1.length>60&&c5.length>60){used=y;break}}catch(e){}
    }
    if(!used)throw new Error('No data. The market may be closed or the feed is blocked.');
    const px=c1[c1.length-1].c,last=c1[c1.length-1].t;
    const k1=c1.slice(0,-1),k5=c5.slice(0,-1); // closed candles only
    const rs=[1,-1].map(s=>{const r=scan(s===1?k1:mir(k1),s===1?k5:mir(k5),P,s);r.s=s;return r});
    const cnt=r=>Object.values(r.ck).filter(v=>v[0]).length;
    const w=rs.find(r=>r.setup)||rs.sort((a,b)=>cnt(b)-cnt(a))[0];
    const F=v=>v.toFixed(P.d);
    let top;
    if(w.setup){
      const S=w.setup,side=w.s===1?'SELL':'BUY',risk=Math.abs(S.sl-S.entry),prog=(S.entry-px)*w.s/risk;
      let st=['v','VALID: entry zone still active'];
      if(S.state==='stopped'||prog<=-1)st=['x','INVALID: stop level already hit'];
      else if(S.state==='tp')st=['x','MISSED: target already hit'];
      else if(prog>=0.5)st=['l',`LATE: price already ${prog.toFixed(1)}R in profit, skip or wait`];
      top=`<div class="v ${st[0]}"><div class="big">${side} ${P.s}</div><div>${st[1]}</div></div>
<table>
<tr><td>Entry</td><td>${F(S.entry)}</td></tr>
<tr><td>Stop loss</td><td>${F(S.sl)}</td></tr>
<tr><td>Take profit</td><td>${F(S.tp)}</td></tr>
<tr><td>Move to break-even at</td><td>${S.be===null?'n/a':F(S.be)}</td></tr>
<tr><td>Reward : risk</td><td>${S.rr.toFixed(1)} : 1</td></tr>
<tr><td>Current price</td><td>${F(px)}</td></tr>
<tr><td>Signal candle</td><td>${T(S.t)}</td></tr>
</table>
<p class="mu">Bonus: ${S.prem?`✓ ${w.s===1?'premium':'discount'} of the 24h range`:'✗ not in premium/discount of the 24h range'} (optional). SMT is not checked.</p>`;
    }else top=`<div class="v x"><div class="big">NO TRADE</div><div>Not every rule is met. Skipping is part of the strategy.</div></div>`;
    const age=(Date.now()-last)/60000;
    el.innerHTML=top+'<ul>'+Object.entries(NAMES).map(([k,n])=>{const v=w.ck[k];return`<li class="${v[0]?'ok':'no'}"><b>${v[0]?'✓':'✗'} ${n}</b><span>${v[1]}</span></li>`}).join('')+'</ul>'
      +(age>10?`<p class="mu" style="color:var(--wa)">Last candle was ${T(last)} (${Math.round(age)} min ago). The market may be closed or the feed delayed.</p>`:'')
      +(used==='GC=F'?'<p class="mu" style="color:var(--wa)">Using gold futures (GC=F). Its price differs from spot XAUUSD, so rescale levels on your broker chart.</p>':'')
      +`<p class="mu">Analysed ${T(Date.now())} · feed ${used}</p>`;
  }catch(e){el.innerHTML=`<p style="color:var(--no)">${e.message}</p>`}
}

$('grid').innerHTML=PAIRS.map((p,i)=>`<div class="card"><button onclick="run(${i})"><span>${p.s} <span class="mu">${p.n}</span></span><small>Analyse ›</small></button><div class="res" id="r${i}"></div></div>`).join('');
</script>
</body>
</html>
